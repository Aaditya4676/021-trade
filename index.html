<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6f2" />
    <script>
      try {
        const theme = localStorage.getItem('021-trade-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch { /* Use the system theme when storage is unavailable. */ }
    </script>
    <meta name="description" content="Paper Terminal, a live paper trading workspace for ten NSE equities." />
    <title>Paper Terminal · Trading Simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
